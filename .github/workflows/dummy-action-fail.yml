# Scenario: a MARKETPLACE action that fails.
# The failing step is a `uses:` of actions/github-script, so its log group header
# is `Run actions/github-script@<sha>` — exercising shuck's KindAction
# classification (a single-line owner/action@ref command) rather than a shell run.
# The ref is SHA-pinned, so that header carries the SHA rather than a tag.
name: Dummy Action Fail

on:
  pull_request:

permissions:
  contents: read

jobs:
  marketplace-action-fail:
    runs-on: ubuntu-latest
    steps:
      - name: Failing marketplace action (github-script)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            core.info("about to throw from a marketplace action");
            core.error("ERROR: marketplace action failure injected for shuck testing");
            throw new Error("marketplace action boom");
