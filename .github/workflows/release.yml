name: Release

on:
  push:
    tags:
      - "v*"

# Default to read-only; the goreleaser job declares the write scopes it needs
# (job-level permissions replace, not extend, the workflow-level ones).
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Keyless cosign signing of checksums.txt uses the workflow OIDC token.
      id-token: write
      # SLSA build-provenance attestation for the released artifacts.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds must not trust a shared cache (cache poisoning).
          cache: false
      # cosign signs checksums.txt; syft generates the per-archive SBOMs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # The default GITHUB_TOKEN only reaches this repo, so pushing the cask to
      # justanotherspy/homebrew-tap needs a second credential. Rather than a
      # long-lived PAT, federate this job's OIDC token for a token scoped to the
      # tap alone, valid for the length of the run. The grant lives in the tap at
      # .github/chainguard/shuck.sts.yaml and trusts exactly this job's subject,
      # repo:justanotherspy/shuck:environment:release.
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: tap-sts
        with:
          scope: justanotherspy/homebrew-tap
          identity: shuck

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name kept: .goreleaser.yaml templates the cask push token as
          # {{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}. Only the source changed.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-sts.outputs.token }}

      # Generate SLSA build provenance covering every released artifact (one
      # attestation keyed off checksums.txt). Verify with:
      #   gh attestation verify <archive> --repo justanotherspy/shuck
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The release is published/created as a prerelease so its "Latest" badge
      # (and the Homebrew cask) never point at a release before its binaries and
      # cask are attached. goreleaser has finished uploading by this step, so
      # promote the release: clear the prerelease flag and mark it latest.
      - name: Promote release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease=false \
            --latest

  # Build & push the release container image to GHCR (the semver tags and
  # :latest). This calls docker.yml rather than relying on a `release:` trigger
  # there: GoReleaser creates the release with the workflow's GITHUB_TOKEN, and
  # token-created events never trigger other workflows. `needs: goreleaser`
  # keeps the image publish behind the same "release" environment approval that
  # gates goreleaser.
  docker:
    needs: goreleaser
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing + provenance OIDC
      attestations: write # actions/attest-build-provenance
    uses: ./.github/workflows/docker.yml
