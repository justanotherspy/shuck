name: Verify octo-sts federation

# Manual smoke test for the credential the release workflow depends on.
#
# The release path pushes a Homebrew cask into justanotherspy/homebrew-tap with
# a token minted by octo-sts rather than a PAT. That exchange needs the Octo STS
# App installed with access to the tap, a trust policy in the tap, and an OIDC
# subject the policy trusts. Finding out at release time is expensive, so this
# reproduces the exchange on demand.
#
# It federates as `shuck-verify`, NOT as the release identity, and the
# difference matters when reading the result.
#
#   The release job runs in the `release` environment, so its subject is
#   repo:justanotherspy/shuck:environment:release. That environment admits only
#   `tag: v*`, so a workflow_dispatch run — always on a branch — can neither
#   enter it nor produce that subject. A test that tried would be rejected by
#   the branch policy before it ran, which is exactly what happened to the first
#   version of this file.
#
# So this proves the plumbing: App installed, policy readable, exchange works,
# token usable against the tap. It does NOT prove the release subject string —
# only a real tagged release exercises that. What it does give you if a release
# ever fails is the subject-printing step below, which is nearly always the
# answer.
#
# Read-only: `shuck-verify` grants contents:read, so this cannot modify the tap.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Federate a tap token and read the tap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # federate to octo-sts
    steps:
      # Print the subject this job actually presents. Trust policies match on
      # it exactly, so when an exchange fails this is nearly always the answer.
      - name: Show this job's OIDC subject
        run: |
          set -euo pipefail
          jwt="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=octo-sts.dev" | jq -r .value)"
          # Decode the payload segment only; the signature is GitHub's problem.
          payload="$(echo "$jwt" | cut -d. -f2)"
          # base64url -> base64, then pad to a multiple of 4.
          payload="$(echo "$payload" | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims="$(echo "$payload" | base64 -d 2>/dev/null)"
          sub="$(echo "$claims" | jq -r .sub)"
          echo "sub    = ${sub}"
          echo "issuer = $(echo "$claims" | jq -r .iss)"
          {
            echo "### OIDC subject"
            echo
            echo '```'
            echo "${sub}"
            echo '```'
            echo
            echo "The tap's \`shuck-verify.sts.yaml\` must trust exactly this."
            echo
            echo "A real release runs in the \`release\` environment and presents"
            echo "\`repo:justanotherspy/shuck:environment:release\` instead, which is"
            echo "what \`shuck.sts.yaml\` trusts."
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: tap-sts
        with:
          scope: justanotherspy/homebrew-tap
          identity: shuck-verify

      # Proves the minted token is real and reaches the tap. Deliberately a
      # read: this job must never write to the tap outside a release.
      - name: Read the tap with the federated token
        env:
          GH_TOKEN: ${{ steps.tap-sts.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/justanotherspy/homebrew-tap \
            --jq '"ok: reached \(.full_name) (default branch \(.default_branch))"'
          {
            echo
            echo "### Federation"
            echo
            echo "Exchanged the OIDC token for a tap-scoped token and read"
            echo "\`justanotherspy/homebrew-tap\` with it — the App is installed,"
            echo "the policy is readable, and federation works."
            echo
            echo "The release identity uses a different subject, so its first"
            echo "real proof is the next tagged release."
          } >> "${GITHUB_STEP_SUMMARY}"